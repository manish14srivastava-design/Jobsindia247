name: Android CI - APK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    env:
      JAVA_OPTS: "-Djava.awt.headless=true -Xmx3072m"
      _JAVA_OPTIONS: "-Djava.awt.headless=true -Xmx3072m"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.configuration-cache=false -Dorg.gradle.caching=false -Dorg.gradle.warning.mode=none -Djava.awt.headless=true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-disabled: true

      - name: Prepare Secrets and Environment
        run: |
          # Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

          # Ensure app/google-services.json exists
          if [ ! -f "app/google-services.json" ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "jobsindia247-tracking",
              "storage_bucket": "jobsindia247-tracking.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef0123456789abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.jobsindia247.trkzpm"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForCiBuildPipeline123456"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          # Accept all licenses
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean :app:assembleDebug --stacktrace
          else
            gradle clean :app:assembleDebug --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobsindia247-telecaller-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
